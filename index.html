*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1a6b2f;--green2:#23903f;--gold:#f5c800;--white:#fff;--gray:#8a9180;--dark:#111a0f;--border:#2a3a24;--card:#1a2a16;--card2:#0e1a0c;--red:#c0392b}
body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);min-height:100vh}
header{background:var(--green);border-bottom:3px solid var(--gold);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--gold);line-height:1}
.logo span{color:var(--white)}
.header-sub{font-size:10px;color:rgba(255,255,255,0.65);letter-spacing:1px;margin-top:2px}
.limit-badge{background:var(--gold);color:var(--dark);font-weight:700;font-size:11px;padding:5px 12px;border-radius:20px}
.group-badge{background:rgba(255,255,255,0.15);color:var(--white);font-size:11px;padding:4px 10px;border-radius:20px;display:none}
#screen-group,#screen-identity,#screen-main{display:none}
#screen-group.active,#screen-identity.active,#screen-main.active{display:block}
.center-screen{max-width:420px;margin:60px auto;padding:0 20px;text-align:center}
.center-screen h2{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--gold);margin-bottom:8px}
.center-screen p{color:var(--gray);font-size:13px;margin-bottom:28px;line-height:1.6}
.group-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.group-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:16px 20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between}
.group-card:hover{border-color:var(--gold);transform:translateY(-1px)}
.group-card-name{font-weight:700;font-size:15px}
.group-card-desc{font-size:11px;color:var(--gray);margin-top:3px}
.group-card-arrow{color:var(--gold);font-size:20px}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--gray);font-size:11px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.code-input-wrap{display:flex;gap:8px}
.code-input{flex:1;background:var(--card);border:1px solid #3a5030;border-radius:8px;padding:10px 14px;color:var(--white);font-size:14px;font-family:'Inter',sans-serif;outline:none;text-transform:uppercase;letter-spacing:2px}
.code-input:focus{border-color:var(--gold)}
.code-btn{background:var(--gold);color:var(--dark);border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer}
.code-btn:hover{background:#e6b800}
.code-error{color:#e74c3c;font-size:12px;margin-top:8px;min-height:18px}
.name-input-big{width:100%;background:var(--card);border:1px solid #3a5030;border-radius:8px;padding:12px 16px;color:var(--white);font-size:16px;font-family:'Inter',sans-serif;outline:none;margin-bottom:12px}
.name-input-big:focus{border-color:var(--gold)}
.name-btn-big{width:100%;background:var(--gold);color:var(--dark);border:none;border-radius:8px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:10px}
.name-btn-big:hover{background:#e6b800}
.change-group-link{font-size:11px;color:var(--gray);cursor:pointer;text-decoration:underline;background:none;border:none}
main{max-width:1100px;margin:0 auto;padding:20px 14px 80px}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.user-info{font-size:13px;color:var(--gold);font-weight:600}
.change-btn{background:none;border:1px solid var(--border);color:var(--gray);border-radius:6px;padding:5px 12px;font-size:11px;cursor:pointer}
.change-btn:hover{border-color:var(--gold);color:var(--gold)}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;color:var(--gold);margin-bottom:12px;padding-bottom:5px;border-bottom:1px solid var(--border)}
#matches-view,#scores-view{display:none}
#matches-view.active,#scores-view.active{display:block}
.back-btn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--border);color:var(--gray);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;margin-bottom:18px;transition:all .15s}
.back-btn:hover{border-color:var(--gold);color:var(--gold)}
.match-header{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:20px;text-align:center}
.match-teams{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--white)}
.match-vs{color:var(--gold);font-size:22px;margin:0 8px}
.match-meta{font-size:11px;color:var(--gray);margin-top:6px}
.match-totals{display:flex;gap:16px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.match-total-pill{background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px}
.match-total-pill span{color:var(--gold);font-weight:700}
.match-closed-banner{background:#7b1a1a;border:1px solid #c0392b;border-radius:8px;padding:8px 14px;font-size:12px;color:#ffaaaa;margin-top:10px;display:inline-block}
.groups-container{display:flex;flex-direction:column;gap:24px}
.group-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.group-title::after{content:'';flex:1;height:1px;background:var(--border)}
.matches-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.match-card{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s}
.match-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.match-card.has-bids{border-color:var(--green2)}
.match-card.closed{border-color:#7b2a2a;opacity:.85}
.mc-teams{font-weight:700;font-size:13px;text-align:center;margin-bottom:5px;line-height:1.4}
.mc-vs{color:var(--gold);font-size:11px;margin:0 4px}
.mc-date{font-size:10px;color:var(--gray);text-align:center;margin-bottom:4px}
.mc-kickoff{font-size:10px;text-align:center;margin-bottom:6px;font-weight:600}
.mc-kickoff.open{color:#2ecc71}
.mc-kickoff.soon{color:var(--gold)}
.mc-kickoff.closed{color:#e74c3c}
.mc-stats{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.mc-bid-count{font-size:10px;color:var(--gray)}
.mc-top-bid{font-size:11px;color:var(--gold);font-weight:600}
.mc-pot{font-size:10px;color:#aaa}
.mc-arrow{color:var(--gray);font-size:14px}
.scores-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.score-card{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:all .15s}

.score-card.mine{border-color:var(--gold);background:#1e2a10}
.score-card.sold{border-color:var(--green2);background:#0f1f0c}
.score-display{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:var(--white);text-align:center;line-height:1}
.score-display .sep{color:var(--gold)}
.bid-info{text-align:center}

.mine-tag{display:none;text-align:center;font-size:9px;font-weight:700;background:var(--gold);color:var(--dark);border-radius:4px;padding:2px 6px}
.score-card.mine .mine-tag{display:block}
.progress-wrap{background:var(--card2);border-radius:4px;height:3px;overflow:hidden}
.progress-bar{height:100%;background:var(--green2);border-radius:4px;transition:width .4s}
.progress-bar.full{background:var(--gold)}

.bid-btn.closed-match{background:#7b1a1a;cursor:not-allowed}

.lb-row.me{background:#1e2a10}
.lb-rank{color:var(--gray);width:22px;font-size:11px}
.lb-name{flex:1;font-weight:600}
.lb-matches{color:var(--gray);font-size:10px;flex:2}
.lb-total{color:var(--gold);font-weight:700;white-space:nowrap}
.lb-empty{padding:16px;color:var(--gray);font-size:13px}
#status-bar{position:fixed;bottom:0;left:0;right:0;background:#06100a;border-top:1px solid var(--border);padding:6px 16px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--gray);z-index:100}
#sdot{width:7px;height:7px;border-radius:50%;background:var(--gray);display:inline-block;margin-right:6px}
#sdot.live{background:#2ecc71;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:500px){.scores-grid{grid-template-columns:repeat(3,1fr)}.matches-grid{grid-template-columns:1fr 1fr}}

  {id:"l2",home:"Ghana",away:"Panamá",date:"Jun 17",ko:[2026,5,17,18,0]},
  {id:"l3",home:"Inglaterra",away:"Ghana",date:"Jun 23",ko:[2026,5,23,15,0]},
  {id:"l4",home:"Panamá",away:"Croacia",date:"Jun 23",ko:[2026,5,23,18,0]},
  {id:"l5",home:"Croacia",away:"Ghana",date:"Jun 27",ko:[2026,5,27,18,0]},
  {id:"l6",home:"Panamá",away:"Inglaterra",date:"Jun 27",ko:[2026,5,27,18,0]},
];

const GROUPS_FIFA=[
  {name:"Grupo A",ids:["a1","a2","a3","a4","a5","a6"]},
  {name:"Grupo B",ids:["b1","b2","b3","b4","b5","b6"]},
  {name:"Grupo C",ids:["c1","c2","c3","c4","c5","c6"]},
  {name:"Grupo D",ids:["d1","d2","d3","d4","d5","d6"]},
  {name:"Grupo E",ids:["e1","e2","e3","e4","e5","e6"]},
  {name:"Grupo F",ids:["f1","f2","f3","f4","f5","f6"]},
  {name:"Grupo G",ids:["g1","g2","g3","g4","g5","g6"]},
  {name:"Grupo H",ids:["h1","h2","h3","h4","h5","h6"]},
  {name:"Grupo I",ids:["i1","i2","i3","i4","i5","i6"]},
  {name:"Grupo J",ids:["j1","j2","j3","j4","j5","j6"]},
  {name:"Grupo K",ids:["k1","k2","k3","k4","k5","k6"]},
  {name:"Grupo L",ids:["l1","l2","l3","l4","l5","l6"]},
];

const SCORES=[];for(let i=0;i<=5;i++)for(let j=0;j<=5;j++)SCORES.push(i+'-'+j);
const MAX_BID=20000;

let db,currentUser='',currentGroupId='',currentGroupName='',auctionData={bids:{}},currentMatch=null;
let unsubscribe=null;

function docId(){return 'mundial2026_'+currentGroupId}
function fmt(n){return n?'$'+n.toLocaleString('es-CO'):''}
function pct(n){return Math.min(100,Math.round((n/MAX_BID)*100))}
function safeId(s){return s.replace(/[^a-z0-9]/gi,'_')}
function setStatus(msg,live){document.getElementById('stext').textContent=msg;document.getElementById('sdot').className=live?'live':''}
function showMsg(key,msg,type){const el=document.getElementById('m_'+safeId(key));if(!el)return;el.textContent=msg;el.className='card-msg '+type;setTimeout(()=>{el.textContent='';el.className='card-msg'},3000)}
function getMatch(id){return MATCHES_DATA.find(m=>m.id===id)}
function getMatchBids(mid){return(auctionData.bids&&auctionData.bids[mid])||{}}

// ── TIME HELPERS (Colombia = UTC-5) ──
function nowCOL(){
  const now=new Date();
  // UTC offset for Colombia is -5h
  const utc=now.getTime()+now.getTimezoneOffset()*60000;
  return new Date(utc+(-5)*3600000);
}
function kickoffDate(ko){
  // ko = [year, month0, day, hour, min] in COL time
  // We create the date as UTC+0 then adjust
  const d=new Date(Date.UTC(ko[0],ko[1],ko[2],ko[3]+5,ko[4]));
  return d;
}
function isMatchClosed(ko){
  const now=new Date();
  const ko_utc=kickoffDate(ko);
  return now>=ko_utc;
}
function minutesUntil(ko){
  const now=new Date();
  const ko_utc=kickoffDate(ko);
  return Math.round((ko_utc-now)/60000);
}
function kickoffLabel(ko){
  const mins=minutesUntil(ko);
  if(mins<0) return{label:'Cerrado',cls:'closed'};
  if(mins<60) return{label:'Cierra en '+mins+' min',cls:'soon'};
  const h=ko[3].toString().padStart(2,'0');
  const m=ko[4].toString().padStart(2,'0');
  return{label:'Kickoff '+h+':'+m+' COL',cls:'open'};
}
function matchPot(mid){
  const bids=getMatchBids(mid);
  return Object.values(bids).reduce((s,b)=>s+(b&&b.amount?b.amount:0),0);
}

// ── SCREENS ──
function showScreen(id){['screen-group','screen-identity','screen-main'].forEach(s=>{document.getElementById(s).classList.toggle('active',s===id)})}

// ── GROUP SCREEN ──
function renderGroupScreen(){
  const c=document.getElementById('group-cards');c.innerHTML='';
  PREDEFINED_GROUPS.forEach(g=>{
    const d=document.createElement('div');d.className='group-card';
    d.innerHTML='<div><div class="group-card-name">'+g.name+'</div><div class="group-card-desc">'+g.desc+'</div></div><span class="group-card-arrow">›</span>';
    d.onclick=()=>enterGroup(g.id,g.name);c.appendChild(d);
  });
}
function enterGroup(id,name){
  currentGroupId=id;currentGroupName=name;
  localStorage.setItem('mundial_group_id',id);localStorage.setItem('mundial_group_name',name);
  document.getElementById('identity-title').textContent='Grupo: '+name;
  showScreen('screen-identity');document.getElementById('name-input-big').focus();
}
document.getElementById('code-btn').addEventListener('click',()=>{
  const code=document.getElementById('code-input').value.trim().toUpperCase();
  const found=PREDEFINED_GROUPS.find(g=>g.code===code);
  if(found){document.getElementById('code-error').textContent='';enterGroup(found.id,found.name);}
  else if(code.length>=4){document.getElementById('code-error').textContent='';enterGroup(code.toLowerCase(),code);}
  else document.getElementById('code-error').textContent='Código inválido. Mínimo 4 caracteres.';
});
document.getElementById('code-input').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('code-btn').click()});
document.getElementById('change-group-link').addEventListener('click',()=>showScreen('screen-group'));

// ── IDENTITY ──
document.getElementById('name-btn-big').addEventListener('click',()=>{
  const name=document.getElementById('name-input-big').value.trim();if(!name)return;
  currentUser=name;localStorage.setItem('mundial_user',name);launchApp();
});
document.getElementById('name-input-big').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('name-btn-big').click()});

// ── LAUNCH ──
async function launchApp(){
  document.getElementById('user-info').textContent='👤 '+currentUser+' · 🏟 '+currentGroupName;
  document.getElementById('group-badge').textContent=currentGroupName;document.getElementById('group-badge').style.display='inline';
  showScreen('screen-main');
  document.getElementById('matches-view').classList.add('active');document.getElementById('scores-view').classList.remove('active');
  if(unsubscribe)unsubscribe();
  const ref=doc(db,'subastas',docId());
  const snap=await getDoc(ref);
  if(!snap.exists())await setDoc(ref,{bids:{},lastUpdate:Date.now()});
  unsubscribe=onSnapshot(ref,(s)=>{
    auctionData=s.exists()?s.data():{bids:{}};
    if(currentMatch)renderScoresView();else renderMatchesView();
    setStatus('En vivo · '+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),true);
  },(err)=>{setStatus('Error de conexión',false);console.error(err)});
}

document.getElementById('change-user-btn').addEventListener('click',()=>{
  if(unsubscribe){unsubscribe();unsubscribe=null}
  currentUser='';currentGroupId='';currentGroupName='';currentMatch=null;auctionData={bids:{}};
  document.getElementById('group-badge').style.display='none';
  document.getElementById('code-input').value='';document.getElementById('name-input-big').value='';
  renderGroupScreen();showScreen('screen-group');setStatus('Desconectado',false);
});

// ── MATCHES VIEW ──
function renderMatchesView(){
  const c=document.getElementById('groups-container');c.innerHTML='';
  GROUPS_FIFA.forEach(g=>{
    const div=document.createElement('div');
    let html='<div class="group-title">'+g.name+'</div><div class="matches-grid">';
    g.ids.forEach(mid=>{
      const m=getMatch(mid);if(!m)return;
      const bids=getMatchBids(mid);
      const cnt=Object.values(bids).filter(b=>b&&b.amount>0).length;
      const top=Math.max(0,...Object.values(bids).map(b=>b?b.amount||0:0));
      const pot=matchPot(mid);
      const closed=isMatchClosed(m.ko);
      const kl=kickoffLabel(m.ko);
      html+='<div class="match-card'+(cnt>0?' has-bids':'')+(closed?' closed':'')+'" onclick="window._ss(\''+mid+'\')">'
        +'<div class="mc-teams">'+m.home+'<span class="mc-vs">vs</span>'+m.away+'</div>'
        +'<div class="mc-date">'+m.date+'</div>'
        +'<div class="mc-kickoff '+kl.cls+'">'+kl.label+'</div>'
        +'<div class="mc-stats"><span class="mc-bid-count">'+cnt+'/36</span>'
        +(pot>0?'<span class="mc-pot">Pozo: '+fmt(pot)+'</span>':'')
        +'<span class="mc-arrow">›</span></div></div>';
    });
    html+='</div>';div.innerHTML=html;c.appendChild(div);
  });
  renderLeaderboard();
}

// ── SCORES VIEW ──
function renderScoresView(){
  const m=getMatch(currentMatch);if(!m)return;
  const closed=isMatchClosed(m.ko);
  const kl=kickoffLabel(m.ko);
  const pot=matchPot(currentMatch);
  const bids=getMatchBids(currentMatch);
  const cnt=Object.values(bids).filter(b=>b&&b.amount>0).length;
  document.getElementById('match-header').innerHTML=
    '<div class="match-teams">'+m.home+'<span class="match-vs">vs</span>'+m.away+'</div>'
    +'<div class="match-meta">'+m.date+'</div>'
    +'<div class="match-totals">'
      +'<div class="match-total-pill">Pozo total: <span>'+fmt(pot)+'</span></div>'
      +'<div class="match-total-pill">Marcadores vendidos: <span>'+cnt+'/36</span></div>'
    +'</div>'
    +(closed?'<div class="match-closed-banner">🔒 Subasta cerrada — el partido ya comenzó</div>':'<div class="match-closed-banner" style="background:#1a3a1a;border-color:#2a6a2a;color:#aaffaa">🟢 '+kl.label+' — Subasta abierta</div>');

  const grid=document.getElementById('scores-grid');grid.innerHTML='';
  SCORES.forEach(score=>{
    const bid=(bids[score])||{amount:0,user:''};
    const isMine=bid.user===currentUser&&!!currentUser;
    const isSold=bid.amount>=MAX_BID;
    const parts=score.split('-');
    const canBid=!!currentUser&&!isSold&&!closed;
    const minNext=Math.max(bid.amount+1000,1000);
    const key=currentMatch+'_'+score;
    const card=document.createElement('div');
    card.className='score-card'+(isMine?' mine':'')+(isSold?' sold':'');
    const btnClass=isSold?'locked':closed?'closed-match':'';
    const btnLabel=isSold?'🔒':closed?'⏱':'Pujar';
    card.innerHTML='<div class="score-display">'+parts[0]+'<span class="sep">–</span>'+parts[1]+'</div>'
      +'<div class="bid-info">'+(bid.amount>0?'<div class="current-bid">'+fmt(bid.amount)+'</div><div class="bidder-name">👤 '+bid.user+'</div>':'<div class="bid-zero">Sin pujas</div>')+'</div>'
      +'<div class="progress-wrap"><div class="progress-bar'+(pct(bid.amount)>=100?' full':'')+'" style="width:'+pct(bid.amount)+'%"></div></div>'
      +'<div class="mine-tag">⭐ TUYO</div>'
      +'<div class="bid-row"><input class="bid-input" type="number" min="'+minNext+'" max="'+MAX_BID+'" step="1000" placeholder="'+(isSold?'Adjudicado':closed?'Cerrado':fmt(minNext))+'" '+(canBid?'':'disabled')+' data-match="'+currentMatch+'" data-score="'+score+'"/>'
      +'<button class="bid-btn '+btnClass+'" '+(!canBid?'disabled':'')+' data-match="'+currentMatch+'" data-score="'+score+'">'+btnLabel+'</button></div>'
      +'<div class="card-msg" id="m_'+safeId(key)+'"></div>';
    grid.appendChild(card);
  });
  grid.querySelectorAll('.bid-btn:not([disabled])').forEach(b=>{b.addEventListener('click',()=>handleBid(b.dataset.match,b.dataset.score))});
  grid.querySelectorAll('.bid-input:not([disabled])').forEach(inp=>{inp.addEventListener('keydown',e=>{if(e.key==='Enter')handleBid(inp.dataset.match,inp.dataset.score)})});
}

// ── BID ──
async function handleBid(matchId,score){
  if(!currentUser){alert('Primero escribe tu nombre.');return}
  const m=getMatch(matchId);
  if(m&&isMatchClosed(m.ko)){alert('La subasta para este partido ya está cerrada.');return}
  const inp=document.querySelector('.bid-input[data-match="'+matchId+'"][data-score="'+score+'"]');
  const amount=parseInt(inp?.value);
  const key=matchId+'_'+score;
  if(!amount||isNaN(amount)){showMsg(key,'Escribe un monto','err');return}
  if(amount<1000){showMsg(key,'Mínimo $1.000','err');return}
  if(amount>MAX_BID){showMsg(key,'Máximo '+fmt(MAX_BID),'err');return}
  const ref=doc(db,'subastas',docId());
  const snap=await getDoc(ref);
  const fresh=snap.exists()?snap.data():{bids:{}};
  const mb=fresh.bids[matchId]||{};
  const cur=mb[score]||{amount:0,user:''};
  if(cur.amount>=MAX_BID){showMsg(key,'Ya adjudicado','err');return}
  if(amount<=cur.amount){showMsg(key,'Debe superar '+fmt(cur.amount),'err');return}
  const newBids={...fresh.bids};
  newBids[matchId]={...mb,[score]:{amount,user:currentUser,ts:Date.now()}};
  try{
    await setDoc(ref,{bids:newBids,lastUpdate:Date.now()});
    if(inp)inp.value='';
    showMsg(key,amount>=MAX_BID?'🎉 ¡Adjudicado!':'✓ Puja registrada','ok');
  }catch(e){showMsg(key,'Error al guardar','err');console.error(e)}
}

// ── LEADERBOARD ──
function renderLeaderboard(){
  const lb=document.getElementById('leaderboard');
  const users={};
  Object.entries(auctionData.bids||{}).forEach(([mid,mb])=>{
    const m=getMatch(mid);if(!m)return;
    Object.entries(mb||{}).forEach(([score,bid])=>{
      if(!bid||!bid.user)return;
      if(!users[bid.user])users[bid.user]={total:0,items:[]};
      users[bid.user].total+=bid.amount;
      users[bid.user].items.push(m.home+' vs '+m.away+' ('+score+')');
    });
  });
  const sorted=Object.entries(users).sort((a,b)=>b[1].total-a[1].total);
  if(!sorted.length){lb.innerHTML='<div class="lb-header">TABLA — '+currentGroupName.toUpperCase()+'</div><div class="lb-empty">¡Sé el primero en pujar!</div>';return}
  const medals=['🥇','🥈','🥉'];
  let html='<div class="lb-header">TABLA — '+currentGroupName.toUpperCase()+'</div>';
  sorted.forEach(([name,info],i)=>{
    const isMe=name===currentUser;
    const preview=info.items.slice(0,2).join(' · ')+(info.items.length>2?' +'+(info.items.length-2):'');
    html+='<div class="lb-row'+(isMe?' me':'')+'"><span class="lb-rank">'+(medals[i]||i+1)+'</span><span class="lb-name">'+(isMe?'⭐ ':'')+name+'</span><span class="lb-matches">'+preview+'</span><span class="lb-total">'+fmt(info.total)+'</span></div>';
  });
  lb.innerHTML=html;
  document.getElementById('sright').textContent=currentGroupName+' · '+sorted.length+' participante'+(sorted.length!==1?'s':'');
}

window._ss=(mid)=>{currentMatch=mid;document.getElementById('matches-view').classList.remove('active');document.getElementById('scores-view').classList.add('active');renderScoresView()};
document.getElementById('back-btn').addEventListener('click',()=>{currentMatch=null;document.getElementById('scores-view').classList.remove('active');document.getElementById('matches-view').classList.add('active');renderMatchesView()});

// ── INIT ──
async function init(){
  setStatus('Conectando...',false);
  const app=initializeApp(cfg);db=getFirestore(app);
  renderGroupScreen();
  const savedGroup=localStorage.getItem('mundial_group_id');
  const savedGroupName=localStorage.getItem('mundial_group_name');
  const savedUser=localStorage.getItem('mundial_user');
  if(savedGroup&&savedGroupName&&savedUser){currentGroupId=savedGroup;currentGroupName=savedGroupName;currentUser=savedUser;await launchApp();}
}
init();
</script>
