<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subasta Mundial 2026 ⚽</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green:  #1a6b2f;
    --green2: #23903f;
    --gold:   #f5c800;
    --white:  #ffffff;
    --gray:   #8a9180;
    --dark:   #111a0f;
    --border: #2a3a24;
    --card:   #1a2a16;
    --card2:  #0e1a0c;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--dark);
    color: var(--white);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--green);
    border-bottom: 3px solid var(--gold);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    color: var(--gold);
    line-height: 1;
  }
  .logo span { color: var(--white); }
  .header-sub { font-size: 10px; color: rgba(255,255,255,0.65); letter-spacing: 1px; margin-top: 2px; }
  .limit-badge {
    background: var(--gold);
    color: var(--dark);
    font-weight: 700;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 20px;
  }

  /* ── IDENTITY ── */
  #identity-bar {
    background: #0a120a;
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  #identity-bar label { font-size: 12px; color: var(--gray); }
  #name-input {
    flex: 1; min-width: 130px; max-width: 200px;
    background: var(--card);
    border: 1px solid #3a5030;
    border-radius: 6px;
    padding: 7px 11px;
    color: var(--white);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    outline: none;
  }
  #name-input:focus { border-color: var(--gold); }
  #set-name-btn {
    background: var(--gold); color: var(--dark);
    border: none; border-radius: 6px;
    padding: 7px 14px; font-weight: 700; font-size: 12px; cursor: pointer;
  }
  #set-name-btn:hover { background: #e6b800; }
  #active-user { font-size: 13px; font-weight: 600; color: var(--gold); display: none; }
  #change-name {
    font-size: 11px; color: var(--gray); cursor: pointer;
    text-decoration: underline; background: none; border: none;
    display: none;
  }

  /* ── MAIN ── */
  main { max-width: 1080px; margin: 0 auto; padding: 22px 16px 70px; }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px; letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 14px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--border);
  }

  /* ── GRID ── */
  .scores-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
    gap: 12px;
    margin-bottom: 36px;
  }

  /* ── CARD ── */
  .score-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.2s, transform 0.15s;
  }
  .score-card:hover { border-color: #4a7a40; transform: translateY(-2px); }
  .score-card.mine  { border-color: var(--gold); background: #1e2a10; }
  .score-card.sold  { border-color: var(--green2); background: #0f1f0c; }

  .score-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px; letter-spacing: 4px;
    color: var(--white); text-align: center; line-height: 1;
  }
  .score-display .sep { color: var(--gold); }

  .bid-info { text-align: center; }
  .current-bid { font-size: 17px; font-weight: 700; color: var(--gold); }
  .bid-zero { color: var(--gray); font-size: 12px; }
  .bidder-name { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 2px; }

  .mine-tag {
    display: none; text-align: center;
    font-size: 10px; font-weight: 700;
    background: var(--gold); color: var(--dark);
    border-radius: 4px; padding: 2px 6px; letter-spacing: 0.5px;
  }
  .score-card.mine .mine-tag { display: block; }

  .progress-wrap { background: var(--card2); border-radius: 4px; height: 4px; overflow: hidden; }
  .progress-bar  { height: 100%; background: var(--green2); border-radius: 4px; transition: width 0.4s; }
  .progress-bar.full { background: var(--gold); }

  .bid-row { display: flex; gap: 6px; }
  .bid-input {
    flex: 1; min-width: 0;
    background: var(--card2);
    border: 1px solid #3a5030; border-radius: 6px;
    padding: 7px 8px; color: var(--white);
    font-size: 12px; font-family: 'Inter', sans-serif; outline: none;
  }
  .bid-input:focus { border-color: var(--gold); }
  .bid-input:disabled { opacity: 0.35; }

  .bid-btn {
    background: var(--green2); color: var(--white);
    border: none; border-radius: 6px;
    padding: 7px 11px; font-weight: 700; font-size: 12px; cursor: pointer;
    white-space: nowrap; transition: background 0.15s;
  }
  .bid-btn:hover:not(:disabled) { background: #2db84f; }
  .bid-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .bid-btn.locked { background: #555; cursor: not-allowed; }
  .bid-btn.locked:hover { background: #555; }

  .card-msg { font-size: 10px; text-align: center; min-height: 14px; color: var(--gray); }
  .card-msg.err { color: #e74c3c; }
  .card-msg.ok  { color: #2ecc71; }

  /* ── LEGEND ── */
  .legend {
    display: flex; gap: 18px; flex-wrap: wrap;
    font-size: 11px; color: var(--gray); margin-bottom: 18px;
  }
  .ld { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: middle; }

  /* ── LEADERBOARD ── */
  .leaderboard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .lb-header { background: var(--green); padding: 11px 16px; font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 2px; color: var(--gold); }
  .lb-row { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); gap: 10px; font-size: 13px; }
  .lb-row:last-child { border-bottom: none; }
  .lb-row.me { background: #1e2a10; }
  .lb-rank { color: var(--gray); width: 22px; font-size: 11px; }
  .lb-name { flex: 1; font-weight: 600; }
  .lb-scores { color: var(--gray); font-size: 10px; flex: 2; }
  .lb-total { color: var(--gold); font-weight: 700; white-space: nowrap; }
  .lb-empty { padding: 18px 16px; color: var(--gray); font-size: 13px; }

  /* ── STATUS ── */
  #status-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #06100a; border-top: 1px solid var(--border);
    padding: 7px 18px; display: flex; align-items: center;
    justify-content: space-between; font-size: 11px; color: var(--gray); z-index: 100;
  }
  #sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--gray); display: inline-block; margin-right: 6px; }
  #sdot.live { background: #2ecc71; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }

  /* ── LOADING ── */
  #loading { text-align: center; padding: 60px 20px; color: var(--gray); font-size: 14px; }
  .spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media(max-width:480px) {
    .scores-grid { grid-template-columns: repeat(2,1fr); gap:9px; }
    .score-display { font-size:28px; }
  }
</style>
</head>
<body>

<!-- MAIN APP -->
<div id="main-app" style="display:none">

  <header>
    <div>
      <div class="logo">⚽ Subasta <span>Mundial 2026</span></div>
      <div class="header-sub">Elige tu marcador · Haz tu puja</div>
    </div>
    <div class="limit-badge">Límite: $20.000 COP</div>
  </header>

  <div id="identity-bar">
    <label for="name-input">Tu nombre:</label>
    <input id="name-input" type="text" placeholder="Escribe tu nombre..." maxlength="20" />
    <button id="set-name-btn">Entrar</button>
    <span id="active-user"></span>
    <button id="change-name">Cambiar</button>
  </div>

  <main>
    <div id="loading"><div class="spinner"></div>Conectando con Firebase...</div>

    <div id="app" style="display:none">
      <div class="legend">
        <span><span class="ld" style="background:#1a2a16;border:1.5px solid #2a3a24"></span>Disponible</span>
        <span><span class="ld" style="background:#1e2a10;border:1.5px solid #f5c800"></span>Tuyo</span>
        <span><span class="ld" style="background:#0f1f0c;border:1.5px solid #23903f"></span>Adjudicado</span>
      </div>
      <p class="section-title">Marcadores disponibles</p>
      <div class="scores-grid" id="scores-grid"></div>
      <p class="section-title">Tabla de participantes</p>
      <div class="leaderboard" id="leaderboard"></div>
    </div>
  </main>

  <div id="status-bar">
    <span><span id="sdot"></span><span id="stext">Conectando...</span></span>
    <span id="sright"></span>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp }              from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, setDoc, onSnapshot, getDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const SCORES  = ['0-0','1-0','0-1','2-0','0-2','3-0','0-3','2-1','1-2','3-1','1-3','3-2','2-3'];
const MAX_BID = 20000;
const DOC_ID  = 'mundial2026';

let db, currentUser = '', auctionData = {};

// ── Helpers ──
function fmt(n) { return n ? '$' + n.toLocaleString('es-CO') : ''; }
function pct(n) { return Math.min(100, Math.round((n / MAX_BID) * 100)); }
function setStatus(msg, live) {
  document.getElementById('stext').textContent = msg;
  document.getElementById('sdot').className = live ? 'live' : '';
}
function showMsg(score, msg, type) {
  const el = document.getElementById('m-' + score.replace('-','_'));
  if (!el) return;
  el.textContent = msg; el.className = 'card-msg ' + type;
  setTimeout(() => { el.textContent=''; el.className='card-msg'; }, 3000);
}

// ── Init data ──
function emptyData() {
  const d = { bids: {}, lastUpdate: Date.now() };
  SCORES.forEach(s => { d.bids[s] = { amount: 0, user: '' }; });
  return d;
}

// ── Render grid ──
function renderGrid(data) {
  const grid = document.getElementById('scores-grid');
  grid.innerHTML = '';
  SCORES.forEach(score => {
    const bid   = (data.bids && data.bids[score]) || { amount: 0, user: '' };
    const isMine = bid.user === currentUser && !!currentUser;
    const isSold = bid.amount >= MAX_BID;
    const [h, a]  = score.split('-');

    const card = document.createElement('div');
    card.className = 'score-card' + (isMine?' mine':'') + (isSold?' sold':'');

    const minNext = Math.max(bid.amount + 1000, 1000);
    const canBid  = !!currentUser && !isSold;

    card.innerHTML = `
      <div class="score-display">${h}<span class="sep"> — </span>${a}</div>
      <div class="bid-info">
        ${bid.amount > 0
          ? `<div class="current-bid">${fmt(bid.amount)}</div>
             <div class="bidder-name">👤 ${bid.user}</div>`
          : `<div class="bid-zero">Sin pujas aún</div>`}
      </div>
      <div class="progress-wrap">
        <div class="progress-bar${pct(bid.amount)>=100?' full':''}" style="width:${pct(bid.amount)}%"></div>
      </div>
      <div class="mine-tag">⭐ ES TUYO</div>
      <div class="bid-row">
        <input class="bid-input" type="number"
          min="${minNext}" max="${MAX_BID}" step="1000"
          placeholder="${isSold ? 'Adjudicado' : fmt(minNext)}"
          ${!canBid?'disabled':''} data-score="${score}" />
        <button class="bid-btn${isSold?' locked':''}"
          ${!canBid?'disabled':''} data-score="${score}">
          ${isSold ? '🔒' : 'Pujar'}
        </button>
      </div>
      <div class="card-msg" id="m-${score.replace('-','_')}"></div>`;

    grid.appendChild(card);
  });

  grid.querySelectorAll('.bid-btn:not([disabled]):not(.locked)').forEach(btn => {
    btn.addEventListener('click', () => handleBid(btn.dataset.score));
  });
  grid.querySelectorAll('.bid-input:not([disabled])').forEach(inp => {
    inp.addEventListener('keydown', e => { if (e.key==='Enter') handleBid(inp.dataset.score); });
  });
}

// ── Render leaderboard ──
function renderLeaderboard(data) {
  const lb = document.getElementById('leaderboard');
  const users = {};
  SCORES.forEach(s => {
    const b = data.bids && data.bids[s];
    if (b && b.user) {
      if (!users[b.user]) users[b.user] = { total:0, scores:[] };
      users[b.user].total += b.amount;
      users[b.user].scores.push(s);
    }
  });
  const sorted = Object.entries(users).sort((a,b) => b[1].total - a[1].total);
  if (!sorted.length) {
    lb.innerHTML = `<div class="lb-header">TABLA DE PARTICIPANTES</div>
      <div class="lb-empty">Aún no hay pujas — ¡sé el primero!</div>`;
    return;
  }
  const medals = ['🥇','🥈','🥉'];
  let html = '<div class="lb-header">TABLA DE PARTICIPANTES</div>';
  sorted.forEach(([name, info], i) => {
    const isMe = name === currentUser;
    html += `<div class="lb-row${isMe?' me':''}">
      <span class="lb-rank">${medals[i]||i+1}</span>
      <span class="lb-name">${isMe?'⭐ ':''}${name}</span>
      <span class="lb-scores">${info.scores.join(' · ')}</span>
      <span class="lb-total">${fmt(info.total)}</span>
    </div>`;
  });
  lb.innerHTML = html;
  document.getElementById('sright').textContent =
    `${sorted.length} participante${sorted.length!==1?'s':''}`;
}

function render(data) { renderGrid(data); renderLeaderboard(data); }

// ── Place bid ──
async function handleBid(score) {
  if (!currentUser) { alert('Primero escribe tu nombre.'); return; }
  const inp = document.querySelector(`.bid-input[data-score="${score}"]`);
  const amount = parseInt(inp.value);
  if (!amount || isNaN(amount)) { showMsg(score,'Escribe un monto','err'); return; }
  if (amount < 1000)            { showMsg(score,'Mínimo $1.000','err'); return; }
  if (amount > MAX_BID)         { showMsg(score,`Máximo ${fmt(MAX_BID)}`,'err'); return; }

  // Read fresh from Firestore before writing
  const ref  = doc(db, 'subastas', DOC_ID);
  const snap = await getDoc(ref);
  const fresh = snap.exists() ? snap.data() : emptyData();
  const cur   = (fresh.bids && fresh.bids[score]) || { amount:0, user:'' };

  if (cur.amount >= MAX_BID)   { showMsg(score,'Ya adjudicado','err'); return; }
  if (amount <= cur.amount)    { showMsg(score,`Debe superar ${fmt(cur.amount)}`,'err'); return; }

  const newBids = { ...(fresh.bids||{}) };
  newBids[score] = { amount, user: currentUser, ts: Date.now() };

  try {
    await setDoc(ref, { bids: newBids, lastUpdate: Date.now() });
    inp.value = '';
    showMsg(score, amount >= MAX_BID ? '🎉 ¡Adjudicado!' : '✓ Puja registrada', 'ok');
  } catch(e) {
    showMsg(score, 'Error al guardar', 'err');
    console.error(e);
  }
}

// ── User identity ──
function activateUser(name) {
  name = name.trim(); if (!name) return;
  currentUser = name;
  localStorage.setItem('mundial_user', name);
  document.getElementById('name-input').style.display   = 'none';
  document.getElementById('set-name-btn').style.display = 'none';
  document.getElementById('active-user').textContent    = '👤 ' + name;
  document.getElementById('active-user').style.display  = 'inline';
  document.getElementById('change-name').style.display  = 'inline';
  render(auctionData);
}
document.getElementById('set-name-btn').addEventListener('click', () =>
  activateUser(document.getElementById('name-input').value));
document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key==='Enter') activateUser(document.getElementById('name-input').value);
});
document.getElementById('change-name').addEventListener('click', () => {
  currentUser = '';
  document.getElementById('name-input').style.display   = '';
  document.getElementById('set-name-btn').style.display = '';
  document.getElementById('active-user').style.display  = 'none';
  document.getElementById('change-name').style.display  = 'none';
  document.getElementById('name-input').value = '';
  document.getElementById('name-input').focus();
  render(auctionData);
});

// ── Firebase config ──
// Config embedded — no setup needed

// ── Init ──
async function init() {
  const cfg = {
    apiKey:            "AIzaSyCqVNC2hU83IxbeoTU4eRvrfl9X8aRkIZg",
    authDomain:        "subasta-marcadores.firebaseapp.com",
    projectId:         "subasta-marcadores",
    storageBucket:     "subasta-marcadores.firebasestorage.app",
    messagingSenderId: "131558231258",
    appId:             "1:131558231258:web:1c2350d0496ef42a1ea9e3"
  };

  document.getElementById('config-screen').style.display = 'none';
  document.getElementById('main-app').style.display      = 'block';

  try {
    const app = initializeApp(cfg);
    db = getFirestore(app);
  } catch(e) {
    setStatus('Error de configuración Firebase', false);
    console.error(e);
    return;
  }

  const ref = doc(db, 'subastas', DOC_ID);

  // Initialize doc if empty
  const snap = await getDoc(ref);
  if (!snap.exists()) { await setDoc(ref, emptyData()); }

  // Real-time listener
  onSnapshot(ref, (snap) => {
    auctionData = snap.exists() ? snap.data() : emptyData();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display     = 'block';
    render(auctionData);
    setStatus('En vivo · ' + new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'}), true);
  }, (err) => {
    setStatus('Error de conexión', false);
    console.error(err);
  });

  // Restore saved user
  const saved = localStorage.getItem('mundial_user');
  if (saved) { document.getElementById('name-input').value = saved; activateUser(saved); }
}

init();
</script>
</body>
</html>
